<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e746b">
<title>TBQ CERDAS — Ruang Belajar Qur'ani</title>
<style>
:root{color-scheme:light dark;--green:#0e746b;--green2:#159789;--gold:#f2bd59;--ink:light-dark(#173b37,#e5f3f0);--muted:light-dark(#617a76,#a9c1bc);--paper:light-dark(#f4f8f6,#111d1b);--surface:light-dark(#fff,#1b2b28);--line:light-dark(#dce8e4,#30433f);--soft:light-dark(#e7f5f1,#203c36);--rose:light-dark(#fff0e9,#402d27);--shadow:0 10px 28px #063c3210}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--paper)}.topbar{background:linear-gradient(115deg,#0b625a,#128c7f);color:#fff;padding:17px clamp(16px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:44px;height:44px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:24px;border:1px solid #ffffff40}.brand h1{font-size:20px;letter-spacing:.3px;margin:0}.brand p{font-size:12px;margin:2px 0 0;color:#d8f1eb}.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{font-size:12px;padding:6px 10px;border-radius:99px;background:#ffffff20;border:1px solid #ffffff40}.top-actions button{border:1px solid #ffffff55;background:#ffffff16;color:white;border-radius:10px;padding:8px 11px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 78px)}aside{padding:22px 15px;border-right:1px solid var(--line);background:var(--surface)}.nav-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.1px;padding:5px 12px 9px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:12px;text-align:left;padding:11px 12px;border-radius:11px;font-weight:650}.nav button span:first-child{width:23px;text-align:center;font-size:18px}.nav button.active{background:var(--soft);color:var(--green)}.aside-note{margin:24px 7px 0;padding:13px;border-radius:13px;background:var(--soft);font-size:12px;color:var(--muted)}.aside-note strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}main{padding:clamp(18px,3vw,36px);min-width:0}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--green2);font-weight:800;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}.page-head h2{font-size:clamp(23px,3vw,32px);line-height:1.2;margin:5px 0 7px}.page-head p{margin:0;color:var(--muted);max-width:730px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 10px;background:var(--soft);color:var(--green);font-size:12px;font-weight:750;white-space:nowrap}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--soft);font-size:18px}.stat-value{font-size:30px;font-weight:800;letter-spacing:-1px;margin:8px 0 0}.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}.two-col{grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-title h3{font-size:16px;margin:0}.section-title button,.btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font-weight:650}.btn{background:var(--green);border:1px solid var(--green);color:white;border-radius:10px;padding:10px 14px;font-weight:750}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.student-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.student-row:last-child{border-bottom:0}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--soft);color:var(--green);font-weight:850}.student-row strong{display:block;font-size:13px}.student-row small{color:var(--muted);font-size:12px}.tag{display:inline-flex;align-items:center;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:750;background:var(--soft);color:var(--green)}.tag.gold{background:light-dark(#fff4d9,#493c20);color:light-dark(#885d05,#f4cd72)}.tag.blue{background:light-dark(#e7efff,#202f4b);color:light-dark(#315ca4,#b4caff)}.tag.rose{background:var(--rose);color:light-dark(#a34e2f,#f2b7a0)}.empty{padding:23px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.callout{padding:14px;border-radius:13px;background:var(--soft);margin-top:12px}.callout strong{display:block;margin-bottom:4px}.callout p{margin:0;color:var(--muted);font-size:13px}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--green2);border-radius:99px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:10px 11px;min-width:0}.field textarea{min-height:86px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .field{margin:0}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.path-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.path-card{position:relative;overflow:hidden}.path-card .number{font-size:12px;font-weight:850;letter-spacing:.8px;color:var(--green2)}.path-card h3{margin:8px 0;font-size:18px}.path-card p{color:var(--muted);font-size:13px;min-height:58px}.path-card ul{padding-left:19px;font-size:13px}.activity-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.activity{display:flex;flex-direction:column;gap:10px}.activity-icon{width:46px;height:46px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:23px}.activity h3{margin:0;font-size:16px}.activity p{margin:0;color:var(--muted);font-size:13px;flex:1}.choice-list{display:grid;gap:8px;margin:12px 0}.choice{padding:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;text-align:left}.choice.selected{border-color:var(--green2);background:var(--soft);box-shadow:inset 0 0 0 1px var(--green2)}.feedback{padding:12px;border-radius:10px;margin-top:12px;font-weight:650;font-size:13px}.feedback.good{background:var(--soft);color:var(--green)}.feedback.bad{background:var(--rose);color:light-dark(#9a472a,#ffc3a9)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:560px;background:var(--surface)}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}th{background:var(--paper);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.small{font-size:12px}.alert{border:1px solid light-dark(#ead8a5,#5d4c26);background:light-dark(#fff9e9,#302a1b);padding:12px 14px;border-radius:12px;color:light-dark(#76591a,#f4d991);font-size:13px;margin-bottom:17px}.hidden{display:none!important}.footer{padding:24px 0 6px;text-align:center;color:var(--muted);font-size:11px}.toast{position:fixed;bottom:18px;right:18px;max-width:320px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:9}.mobile-nav{display:none}
@media(max-width:980px){.layout{grid-template-columns:205px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.path-grid{grid-template-columns:1fr}.path-card p{min-height:0}}
@media(max-width:680px){.topbar{padding:13px 15px}.brand h1{font-size:17px}.brandmark{width:39px;height:39px}.status{display:none}.layout{display:block;min-height:0}aside{display:none}main{padding:19px 14px 90px}.page-head{display:block}.page-head>.pill{margin-top:12px}.stats{gap:9px}.card{padding:14px;border-radius:14px}.stat-value{font-size:26px}.form-grid,.activity-grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:8;justify-content:space-around;padding:6px 3px calc(6px + env(safe-area-inset-bottom))}.mobile-nav button{background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:5px 7px;min-width:0}.mobile-nav button span:first-child{font-size:19px}.mobile-nav button.active{color:var(--green);font-weight:800}.top-actions button{padding:7px 8px;font-size:12px}.page-head h2{font-size:25px}}
@media print{aside,.top-actions,.mobile-nav,.btn,.btn-secondary{display:none!important}.layout{display:block}main{padding:0}.card{box-shadow:none;break-inside:avoid}.app{background:white;color:#222}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand"><div class="brandmark">۞</div><div><h1>TBQ CERDAS</h1><p>Belajar Sesuai Kemampuan, Bertumbuh Bersama Al-Qur'an</p></div></div>
  <div class="top-actions"><span class="status" id="connectionStatus">● Mode uji lokal</span><button id="exportBtn" title="Unduh cadangan data">⇩ Ekspor data</button></div>
</header>
<div class="layout">
<aside><div class="nav-label">RUANG KERJA GURU</div><nav class="nav" id="sideNav">
<button class="active" data-page="dashboard"><span>▦</span> Dashboard</button><button data-page="students"><span>♙</span> Profil Murid</button><button data-page="assessment"><span>☷</span> TBQ Scan · Asesmen</button><button data-page="path"><span>↗</span> TBQ Path · Jalur Belajar</button><button data-page="play"><span>✦</span> TBQ Play · Latihan</button><button data-page="track"><span>◷</span> TBQ Track · Progres</button><button data-page="home"><span>⌂</span> TBQ Home · Latihan Rumah</button>
</nav><div class="aside-note"><strong>🔒 Privasi murid</strong>Versi uji memakai kode M01–M12 dan data simulasi. Jangan masukkan informasi sensitif atau rekaman asli ke prototipe ini.</div></aside>
<main id="mainContent" aria-live="polite"></main>
</div>
<nav class="mobile-nav" id="mobileNav"><button class="active" data-page="dashboard"><span>▦</span>Beranda</button><button data-page="students"><span>♙</span>Murid</button><button data-page="assessment"><span>☷</span>Asesmen</button><button data-page="play"><span>✦</span>Latihan</button><button data-page="track"><span>◷</span>Progres</button></nav>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{
'use strict';
const STORAGE_KEY='tbq_cerdas_demo_v1';
const initialStudents=Array.from({length:12},(_,i)=>({id:`M${String(i+1).padStart(2,'0')}`,name:`Murid ${String(i+1).padStart(2,'0')}`,path:'Belum dipetakan',baseline:'Belum diasesmen',next:'Lakukan asesmen awal',date:'',notes:'',scores:{letters:'',harakat:'',fluency:'',makhraj:'',tajwid:''},home:'Belum ada target',homeNote:''}));
let state={students:initialStudents,selectedStudent:'M01',page:'dashboard',activity:null,answer:null,feedback:null,simulated:true};
let toastTimer;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({students:state.students,selectedStudent:state.selectedStudent}));}catch(e){} }
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.students)&&d.students.length===12){state.students=d.students;state.selectedStudent=d.selectedStudent||'M01';state.simulated=false;}}}catch(e){}}
function student(id=state.selectedStudent){return state.students.find(s=>s.id===id)||state.students[0]}
function scoreCount(s){return Object.values(s.scores).filter(v=>v!==''&&v!==null&&Number.isFinite(Number(v))).length}
function assessed(s){return scoreCount(s)>0}
function avg(s){const vals=Object.values(s.scores).filter(v=>v!==''&&v!==null&&Number.isFinite(Number(v))).map(Number);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null}
function pathFor(s){const a=Number(s.scores.letters),b=Number(s.scores.harakat),f=Number(s.scores.fluency);if(!assessed(s))return 'Belum dipetakan';if((s.scores.letters!==''&&a<3)||(s.scores.harakat!==''&&b<3))return 'Fondasi Qur’ani';if(s.scores.fluency!==''&&f>=3)return 'Mahir dan Bertumbuh';return 'Tumbuh Membaca'}
function badge(text,kind=''){return `<span class="tag ${kind}">${esc(text)}</span>`}
function head(kicker,title,desc,chip=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></div>${chip?`<span class="pill">${chip}</span>`:''}</div>`}
function stat(label,value,sub,icon){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`}
function studentRows(list){if(!list.length)return '<div class="empty">Belum ada data yang sesuai.</div>';return list.map(s=>`<div class="student-row"><div class="avatar">${s.id.slice(1)}</div><div><strong>${esc(s.id)} · ${esc(s.name)}</strong><small>${esc(s.next||'Belum ada target')}</small></div><div>${badge(s.path,s.path==='Belum dipetakan'?'gold':'')}</div></div>`).join('')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const pages={dashboard:dashboardPage,students:studentsPage,assessment:assessmentPage,path:pathPage,play:playPage,track:trackPage,home:homePage};$('#mainContent').innerHTML=(pages[state.page]||dashboardPage)();if(state.page==='students')wireStudentSearch();if(state.page==='assessment')wireAssessment();if(state.page==='path')wirePath();if(state.page==='play')wirePlay();if(state.page==='home')wireHome();}
function dashboardPage(){const done=state.students.filter(assessed).length;const mapped=state.students.filter(s=>s.path!=='Belum dipetakan').length;const follow=state.students.filter(s=>s.next&&s.next!=='Belum ada target'&&s.next!=='Lakukan asesmen awal').length;const needs=state.students.filter(s=>assessed(s)&&s.path==='Fondasi Qur’ani');return `${head('PUSAT KENDALI GURU','Setiap anak punya jalan belajar.','Pantau kebutuhan, tentukan latihan, lalu validasi perkembangan dengan menyimak bacaan secara langsung.','Versi uji · v0.1')}<div class="alert"><strong>Mode prototipe:</strong> profil awal menggunakan data simulasi, bukan hasil asesmen murid sebenarnya. Masukkan hasil observasi melalui menu TBQ Scan untuk mulai menguji alur kerja.</div><div class="grid stats">${stat('Jumlah profil',state.students.length,'Kode murid anonim','♙')}${stat('Sudah diasesmen',done,`${state.students.length-done} belum memiliki catatan skor`,'☷')}${stat('Sudah dipetakan',mapped,'Jalur belajar dapat berubah','↗')}${stat('Catatan tindak lanjut',follow,'Berdasarkan target yang diisi','◷')}</div><div class="grid two-col"><section class="card"><div class="section-title"><h3>Daftar murid dan kebutuhan berikutnya</h3><button data-goto="students">Lihat semua →</button></div>${studentRows(state.students.slice(0,5))}<div class="callout"><strong>Langkah yang disarankan</strong><p>Mulai dengan asesmen awal sesuai kemampuan yang telah dipelajari. Jangan menilai tajwid yang belum diajarkan sebagai kekurangan murid.</p><div class="btn-row" style="margin-top:11px"><button class="btn" data-goto="assessment">Mulai asesmen</button><button class="btn-secondary" data-goto="play">Coba latihan</button></div></div></section><section class="card"><div class="section-title"><h3>Alur TBQ CERDAS</h3>${badge('Siklus belajar')}</div>${[['1','Cermat memetakan','Guru menyimak dan mencatat kebutuhan.'],['2','Efektif mendampingi','Pilih latihan yang sesuai kebutuhan.'],['3','Rekam progres','Catat latihan dan asesmen ulang.'],['4','Sinergi bersama','Tindak lanjut sekolah dan keluarga.']].map(x=>`<div class="student-row"><div class="avatar">${x[0]}</div><div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}<div class="callout"><strong>Prinsip penting</strong><p>Aplikasi memberi dukungan keputusan; guru tetap memvalidasi bacaan dan menentukan perpindahan jalur.</p></div></section></div><div class="footer">TBQ CERDAS · Prototipe interaktif lokal · Bukan aplikasi produksi atau penyimpanan cloud</div>`}
function studentsPage(){return `${head('DATA BELAJAR','Profil Murid','Gunakan kode anonim. Isi catatan seperlunya dan hindari data pribadi sensitif.','12 profil')}<div class="grid two-col"><section class="card"><div class="section-title"><h3>Daftar profil</h3><span class="muted small">Kode M01–M12</span></div><div class="field"><label for="studentSearch">Cari kode murid</label><input id="studentSearch" placeholder="Contoh: M03"></div><div id="studentList">${studentRows(state.students)}</div></section><section class="card"><div class="section-title"><h3>Ringkasan profil</h3>${badge(state.selectedStudent)}</div><div id="studentDetail">${studentDetail()}</div></section></div>`}
function studentDetail(){const s=student();return `<div class="avatar" style="width:52px;height:52px;font-size:18px;margin-bottom:10px">${s.id.slice(1)}</div><h3 style="margin:0 0 4px">${esc(s.name)}</h3><p class="muted small">Kode anonim · ${esc(s.id)}</p><div class="callout"><strong>Jalur belajar saat ini</strong>${badge(s.path,s.path==='Belum dipetakan'?'gold':'')}<p style="margin-top:7px">${esc(s.next||'Belum ada target')}</p></div><p><strong>Catatan asesmen</strong></p><p class="muted small">${esc(s.notes||'Belum ada catatan guru.')}</p><div class="btn-row"><button class="btn" data-goto="assessment">Isi asesmen</button><button class="btn-secondary" data-goto="path">Lihat jalur</button></div>`}
function wireStudentSearch(){const input=$('#studentSearch');const list=$('#studentList');if(!input||!list)return;const update=()=>{const q=input.value.toLowerCase();list.innerHTML=studentRows(state.students.filter(s=>(s.id+' '+s.name).toLowerCase().includes(q)));list.querySelectorAll('.student-row').forEach((row,i)=>{row.style.cursor='pointer';row.addEventListener('click',()=>{const found=state.students.filter(s=>(s.id+' '+s.name).toLowerCase().includes(q))[i];if(found){state.selectedStudent=found.id;render()}})});};update();$('#studentDetail').innerHTML=studentDetail();}
const assessmentFields=[['letters','Huruf hijaiyah','0–4','Pengenalan huruf yang sudah dipelajari'],['harakat','Harakat dan rangkaian','0–4','Mengenali harakat atau membaca rangkaian sesuai tahap'],['fluency','Kelancaran membaca','1–4','Gunakan bacaan yang sesuai kemampuan saat ini'],['makhraj','Makhraj / pelafalan','1–4','Catat bunyi yang perlu diperbaiki'],['tajwid','Tajwid yang sudah dipelajari','1–4','Jangan uji hukum yang belum diajarkan']];
function assessmentPage(){const s=student();return `${head('TBQ SCAN','Asesmen awal dan pemetaan','Pilih satu profil, lakukan pengamatan langsung, lalu masukkan skor dan catatan. Skor huruf/harakat memakai 0–4; keterampilan membaca memakai rubrik 1–4.','Guru memvalidasi')}<div class="alert">Rubrik ini merupakan instrumen kerja prototipe, bukan standar nasional. Nilai kosong berarti belum dinilai; jangan menganggapnya sebagai nilai nol.</div><div class="grid two-col"><section class="card"><div class="section-title"><h3>Catatan asesmen</h3>${badge(s.id)}</div><form id="assessmentForm"><div class="field"><label for="assStudent">Pilih kode murid</label><select id="assStudent">${state.students.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.id} · ${x.name}</option>`).join('')}</select></div><div class="form-grid">${assessmentFields.map(([key,label,range,help])=>`<div class="field"><label for="score_${key}">${label} <span class="muted">(${range})</span></label><select id="score_${key}" name="${key}"><option value="">Belum dinilai</option>${(key==='letters'||key==='harakat'?[0,1,2,3,4]:[1,2,3,4]).map(n=>`<option value="${n}" ${String(s.scores[key])===String(n)?'selected':''}>${n}</option>`).join('')}</select><span class="muted small">${help}</span></div>`).join('')}</div><div class="field" style="margin-top:14px"><label for="notes">Temuan guru / contoh kesalahan</label><textarea id="notes" placeholder="Contoh: masih tertukar pada huruf ...; perlu latihan ...">${esc(s.notes)}</textarea></div><div class="field"><label for="nextTarget">Target latihan berikutnya</label><input id="nextTarget" value="${esc(s.next==='Lakukan asesmen awal'?'':s.next)}" placeholder="Contoh: membaca rangkaian huruf berharakat fathah"></div><div class="form-actions"><button type="button" class="btn-secondary" id="resetAss">Kosongkan skor</button><button class="btn" type="submit">Simpan catatan</button></div></form></section><section class="card"><h3 style="margin-top:0">Panduan rubrik guru</h3>${[['4','Mandiri dan konsisten','Mampu melakukan keterampilan dengan tepat.'],['3','Sebagian besar tepat','Ada sedikit kesalahan yang dapat diperbaiki.'],['2','Perlu latihan','Masih ada beberapa kesalahan dan butuh arahan.'],['1','Pendampingan intensif','Memerlukan contoh dan bimbingan dekat.']].map(x=>`<div class="student-row"><div class="avatar">${x[0]}</div><div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}<div class="callout"><strong>Validasi bacaan</strong><p>Skor adalah catatan guru. Jangan gunakan prototipe untuk menyatakan bacaan benar secara otomatis. Dengarkan murid membaca dan catat bukti spesifik.</p></div></section></div>`}
function wireAssessment(){const sel=$('#assStudent');sel.addEventListener('change',()=>{state.selectedStudent=sel.value;render()});$('#resetAss').addEventListener('click',()=>{assessmentFields.forEach(([k])=>$('#score_'+k).value='');$('#notes').value='';$('#nextTarget').value='';});$('#assessmentForm').addEventListener('submit',e=>{e.preventDefault();const s=student($('#assStudent').value);assessmentFields.forEach(([k])=>{s.scores[k]=$('#score_'+k).value});s.notes=$('#notes').value.trim();s.next=$('#nextTarget').value.trim()||'Tentukan target dari hasil asesmen';s.date=new Date().toISOString().slice(0,10);s.path=pathFor(s);save();toast(`Catatan ${s.id} tersimpan di perangkat ini.`);render();});}
const paths=[{name:'Fondasi Qur’ani',num:'JALUR 01',color:'gold',desc:'Untuk murid yang masih membangun penguasaan huruf, harakat, dan rangkaian dasar.',goals:['Mengenali huruf dan bentuknya','Membedakan harakat','Membaca rangkaian pendek'],activities:'Kartu huruf, cocokkan harakat, baca bergiliran dengan guru.'},{name:'Tumbuh Membaca',num:'JALUR 02',color:'blue',desc:'Untuk murid yang mulai membaca Al-Qur’an tetapi masih memerlukan latihan kelancaran.',goals:['Membaca kata dan ayat pendek','Mengurangi jeda yang tidak perlu','Memperbaiki pelafalan'],activities:'Baca berulang, susun potongan ayat, simak dan ulangi.'},{name:'Mahir dan Bertumbuh',num:'JALUR 03',color:'',desc:'Untuk murid yang sudah lancar dan perlu menguatkan ketepatan serta kualitas bacaan.',goals:['Memperbaiki makhraj','Menerapkan tajwid yang dipelajari','Menjaga kelancaran dan adab'],activities:'Tandai tajwid, baca ayat terpilih, jelaskan alasan penerapan hukum.'}];
function pathPage(){const s=student();return `${head('TBQ PATH','Jalur belajar fleksibel','Jalur bukan label permanen. Murid berpindah berdasarkan bukti perkembangan dan keputusan guru.','Profil aktif: '+s.id)}<div class="card" style="margin-bottom:15px"><div class="field"><label for="pathStudent">Pilih profil murid</label><select id="pathStudent">${state.students.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.id} · ${x.name}</option>`).join('')}</select></div><div class="callout"><strong>Rekomendasi awal aplikasi</strong><p id="pathRecommendation">${assessed(s)?`Berdasarkan catatan saat ini: ${esc(pathFor(s))}. Guru perlu memeriksa hasil dan memastikan jalur sesuai pengamatan.`:'Belum ada asesmen. Lakukan asesmen awal sebelum menentukan jalur.'}</p></div></div><div class="grid path-grid">${paths.map((p,i)=>`<article class="card path-card"><div class="number">${p.num}</div><h3>${p.name}</h3><p>${p.desc}</p><strong>Target keterampilan</strong><ul>${p.goals.map(g=>`<li>${g}</li>`).join('')}</ul><div class="callout"><strong>Contoh kegiatan</strong><p>${p.activities}</p></div><button class="btn" style="margin-top:14px;width:100%" data-assign-path="${p.name}">Tetapkan jalur ini</button></article>`).join('')}</div><p class="muted small" style="margin-top:14px">Saran otomatis bersifat awal. Guru dapat menetapkan jalur berbeda dengan alasan pedagogis dan bukti pengamatan.</p>`}
function wirePath(){const sel=$('#pathStudent');sel.addEventListener('change',()=>{state.selectedStudent=sel.value;render()});document.querySelectorAll('[data-assign-path]').forEach(b=>b.addEventListener('click',()=>{const s=student();s.path=b.dataset.assignPath;s.next=s.next==='Lakukan asesmen awal'?'Mulai latihan sesuai jalur: '+s.path:s.next;save();toast(`Jalur ${s.path} ditetapkan untuk ${s.id}.`);render()}));}
const activities=[{id:'harakat',icon:'🔤',title:'Pasangkan harakat',desc:'Pilih contoh harakat yang sesuai. Latihan konsep awal.',prompt:'Tanda baca yang menghasilkan bunyi “ba” pendek adalah …',choices:['بَ (fathah)','بِ (kasrah)','بُ (dammah)'],correct:0,why:'Fathah di atas huruf ب menghasilkan bunyi ba pendek.'},{id:'tajwid',icon:'📖',title:'Kenali qalqalah',desc:'Latihan konsep qalqalah pada contoh huruf.',prompt:'Manakah kelompok huruf qalqalah yang umum dipelajari?',choices:['ق ط ب ج د','ا و ي ن م','س ش ص ز ذ'],correct:0,why:'Huruf qalqalah dirangkum dalam قُطْبُ جَدٍّ: ق ط ب ج د.'},{id:'adab',icon:'💚',title:'Adab belajar Al-Qur’an',desc:'Pilih sikap yang menunjukkan adab saat teman membaca.',prompt:'Ketika teman sedang membaca Al-Qur’an, sikap yang tepat adalah …',choices:['Menyela dan menertawakan kesalahan','Menyimak dengan hormat dan memberi masukan santun','Mengobrol dengan teman lain'],correct:1,why:'Menyimak dengan hormat membantu suasana belajar yang aman dan saling mendukung.'},{id:'sequence',icon:'🧩',title:'Urutkan langkah membaca',desc:'Pilih langkah yang paling tepat untuk memperbaiki bacaan.',prompt:'Saat guru mengoreksi bunyi huruf, langkah yang baik adalah …',choices:['Mengabaikan koreksi','Mendengar contoh, menirukan, lalu mencoba lagi','Langsung berpindah ke ayat lain'],correct:1,why:'Mendengar contoh, menirukan, dan mencoba ulang membantu murid memperbaiki bacaan.'}];
function playPage(){if(!state.activity)state.activity='harakat';const a=activities.find(x=>x.id===state.activity)||activities[0];return `${head('TBQ PLAY','Laboratorium belajar interaktif','Latihan singkat untuk IFP atau perangkat murid. Aktivitas ini menguji interaksi aplikasi, bukan pengganti membaca langsung bersama guru.','Bisa dicoba')}<div class="grid activity-grid"><section class="card"><div class="section-title"><h3>Pilih aktivitas</h3>${badge('4 aktivitas')}</div>${activities.map(x=>`<button class="choice ${x.id===state.activity?'selected':''}" data-activity="${x.id}" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left"><span style="font-size:24px">${x.icon}</span><span><strong style="display:block">${x.title}</strong><span class="muted small">${x.desc}</span></span></button>`).join('')}</section><section class="card"><div class="activity-icon">${a.icon}</div><h3 style="margin:12px 0 5px">${a.title}</h3><p class="muted small">${a.desc}</p><div style="height:1px;background:var(--line);margin:15px 0"></div><strong>${a.prompt}</strong><div class="choice-list">${a.choices.map((c,i)=>`<button class="choice ${state.answer===i?'selected':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${c}</button>`).join('')}</div><button class="btn" id="checkAnswer" ${state.answer===null?'disabled':''}>Periksa jawaban</button><div id="playFeedback">${state.feedback?`<div class="feedback ${state.feedback.good?'good':'bad'}">${state.feedback.text}</div>`:''}</div><p class="muted small" style="margin-top:15px">Catatan: latihan ini adalah konten demonstrasi awal. Sebelum diterapkan sebagai materi resmi, guru perlu memeriksa kesesuaian dengan buku, capaian pembelajaran, dan materi yang telah diajarkan.</p></section></div>`}
function wirePlay(){document.querySelectorAll('[data-activity]').forEach(b=>b.addEventListener('click',()=>{state.activity=b.dataset.activity;state.answer=null;state.feedback=null;render()}));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{state.answer=Number(b.dataset.answer);render()}));$('#checkAnswer').addEventListener('click',()=>{const a=activities.find(x=>x.id===state.activity);if(state.answer===null)return;const good=state.answer===a.correct;state.feedback={good,text:(good?'Tepat! ':'Belum tepat. ')+a.why};render()});}
function trackPage(){const rows=state.students.map(s=>`<tr><td><strong>${s.id}</strong></td><td>${esc(s.path)}</td><td>${assessed(s)?`${scoreCount(s)}/5 aspek`:'Belum ada'}</td><td>${avg(s)===null?'—':avg(s)}</td><td>${esc(s.date||'—')}</td><td>${esc(s.next||'—')}</td><td><button class="btn-secondary" data-track-edit="${s.id}">Buka</button></td></tr>`).join('');const done=state.students.filter(assessed).length;return `${head('TBQ TRACK','Progres dan tindak lanjut','Gunakan tabel untuk melihat catatan asesmen, tanggal pencatatan, dan target berikutnya. Angka rata-rata hanya merangkum skor yang telah diisi.','Catatan lokal')}<div class="grid stats">${stat('Profil tercatat',state.students.length,'Termasuk profil kosong','♙')}${stat('Asesmen dimulai',done,'Ada minimal satu aspek dinilai','☷')}${stat('Aspek tercatat',state.students.reduce((n,s)=>n+scoreCount(s),0),'Maksimum 60 isian','✓')}${stat('Belum diasesmen',state.students.filter(s=>!assessed(s)).length,'Perlu observasi guru','◷')}</div><section class="card"><div class="section-title"><h3>Rekap perkembangan</h3><button class="btn-secondary" id="printTrack">Cetak rekap</button></div><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Jalur</th><th>Aspek dinilai</th><th>Rata-rata*</th><th>Tanggal</th><th>Target berikutnya</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted small" style="margin-top:12px">*Rata-rata bersifat ringkasan internal dari skala yang berbeda; jangan gunakan sebagai nilai rapor tanpa rubrik dan interpretasi yang sesuai. Data belum merupakan hasil penelitian atau bukti dampak.</p></section><section class="card" style="margin-top:15px"><h3 style="margin-top:0">Siklus evaluasi</h3><div class="grid path-grid">${[['Amati','Guru mendengarkan bacaan dan mencatat bukti.'],['Latih','Murid melakukan latihan sesuai kebutuhan.'],['Ukur ulang','Gunakan tugas sebanding dengan asesmen awal.']].map((x,i)=>`<div class="callout"><strong>${i+1}. ${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div></section>`}
function homePage(){const s=student();return `${head('TBQ HOME','Jembatan latihan rumah','Buat target sederhana yang dapat dipahami keluarga. Orang tua mendukung kebiasaan belajar; guru tetap memvalidasi bacaan.','Pelibatan keluarga')}<div class="grid two-col"><section class="card"><div class="section-title"><h3>Target latihan rumah</h3>${badge(s.id)}</div><form id="homeForm"><div class="field"><label for="homeStudent">Pilih kode murid</label><select id="homeStudent">${state.students.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.id} · ${x.name}</option>`).join('')}</select></div><div class="field"><label for="homeTarget">Target latihan</label><textarea id="homeTarget" placeholder="Contoh: latihan membaca 5 menit bersama pendamping">${esc(s.home==='Belum ada target'?'':s.home)}</textarea></div><div class="field"><label for="homeNote">Umpan balik keluarga (opsional)</label><textarea id="homeNote" placeholder="Contoh: latihan dilakukan 3 kali minggu ini">${esc(s.homeNote)}</textarea></div><div class="form-actions"><button class="btn" type="submit">Simpan target</button></div></form></section><section class="card"><h3 style="margin-top:0">Panduan untuk keluarga</h3>${[['Dampingi dengan tenang','Sediakan waktu singkat dan suasana nyaman.'],['Utamakan ketepatan','Jangan terburu-buru mengejar banyak halaman.'],['Beri apresiasi','Hargai usaha dan keberanian mencoba.'],['Minta bantuan guru','Catat bagian sulit untuk ditanyakan saat pembelajaran.']].map((x,i)=>`<div class="student-row"><div class="avatar">${i+1}</div><div><strong>${x[0]}</strong><small>${x[1]}</small></div></div>`).join('')}<div class="callout"><strong>Perlindungan data</strong><p>Versi uji ini tidak mengunggah data ke cloud. Jangan menyimpan rekaman suara, nama lengkap, nomor telepon, atau data pribadi keluarga di prototipe ini.</p></div></section></div>`}
function wireHome(){const sel=$('#homeStudent');sel.addEventListener('change',()=>{state.selectedStudent=sel.value;render()});$('#homeForm').addEventListener('submit',e=>{e.preventDefault();const s=student($('#homeStudent').value);s.home=$('#homeTarget').value.trim()||'Belum ada target';s.homeNote=$('#homeNote').value.trim();save();toast(`Target rumah ${s.id} disimpan di perangkat ini.`);render()})}
function navigate(page){state.page=page;state.feedback=null;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}const go=e.target.closest('[data-goto]');if(go){navigate(go.dataset.goto);return}const edit=e.target.closest('[data-track-edit]');if(edit){state.selectedStudent=edit.dataset.trackEdit;navigate('students');return}});
$('#exportBtn').addEventListener('click',()=>{const payload={app:'TBQ CERDAS',version:'0.1 prototype',exportedAt:new Date().toISOString(),notice:'Data ini tersimpan lokal. Profil awal adalah simulasi kecuali telah diubah oleh pengguna.',students:state.students};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tbq-cerdas-cadangan.json';a.click();URL.revokeObjectURL(url);toast('Cadangan data diunduh. Simpan di lokasi aman.');});
$('#mainContent').addEventListener('click',e=>{if(e.target.closest('#printTrack'))window.print()});
load();render();
})();
</script>
</body>
</html>
